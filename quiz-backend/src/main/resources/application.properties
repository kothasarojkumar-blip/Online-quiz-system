# Server configuration
server.port=8080
spring.application.name=online-quiz-backend

# Default Database: Embedded H2 (MySQL compatibility mode)
# Allows instant backend execution without external MySQL service dependency
spring.datasource.url=jdbc:h2:mem:online_quiz;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
