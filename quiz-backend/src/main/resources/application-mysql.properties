# MySQL Production / Local Profile Configuration
# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=mysql
# Or in jar: java -jar quiz-backend-0.0.1-SNAPSHOT.jar --spring.profiles.active=mysql

spring.datasource.url=jdbc:mysql://localhost:3306/online_quiz?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
